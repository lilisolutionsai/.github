name: Developer Request
description: Raise a new request for a developer to pick up.
title: "[Request] "
labels: ["developer-request"]
body:
  - type: textarea
    id: project-status
    attributes:
      label: What is your project status for this request?
      description: Where does this sit today — not started, blocked, partially built, in production?
      placeholder: e.g. Terraform module exists but the pipeline stage was never wired up.
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: What do you expect from devops operations in this request?
      description: Describe the work you need from DevOps for this request.
      placeholder: e.g. Add a nightly cost-anomaly alert to Slack, wire it into the existing pipeline, and document the runbook.
    validations:
      required: true

  - type: textarea
    id: gcp-resources
    attributes:
      label: Mention list of GCP resources that are going to be affected
      description: List every GCP resource this request will create, change, or delete (projects, Cloud Run services, Cloud SQL, buckets, IAM, etc.).
      placeholder: |
        e.g.
        - Cloud Run service: cost-anomaly-alerter
        - Pub/Sub topic: cost-anomaly-events
        - IAM: roles/monitoring.notificationChannelEditor on project lili-prod
    validations:
      required: true

  - type: dropdown
    id: requires-redeployment
    attributes:
      label: Requires redeployment?
      description: Will this request require a redeploy of an existing service or environment?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true for this request to be considered done.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
